kind = "web"
previewPath = "/"
title = "AudioScape Canvas Studio"
description = "A browser-based audio visualizer for creating polished Quran and audio videos with server-rendered MP4 exports."
version = "1.0.0"
id = "artifacts/audioscape-canvas-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20795

[services.development]
run = "pnpm --filter @workspace/audioscape-canvas-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/audioscape-canvas-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/audioscape-canvas-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20795"
BASE_PATH = "/"
